<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynep ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap');

        :root {
            --accent: #ff4d6d;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            background: #0b0e14;
            background: radial-gradient(circle at top right, #1a1e2e, #0b0e14);
            color: #f8f9fa;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #waiting-screen { margin-top: 20vh; animation: fadeIn 1.5s ease; cursor: pointer; }
        .mic-icon { font-size: 70px; margin-bottom: 20px; filter: drop-shadow(0 0 20px var(--accent)); animation: pulse 2s infinite; display: inline-block; }

        #main-content {
            display: none;
            max-width: 420px;
            margin: 20px auto;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 25px;
            border-radius: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .live-counter {
            background: rgba(255, 77, 109, 0.12);
            padding: 20px 10px;
            border-radius: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 77, 109, 0.2);
        }
        .counter-numbers {
            font-size: 20px;
            font-weight: 600;
            color: #ffb3c1;
            display: block;
            letter-spacing: 2px;
            font-family: 'Montserrat', sans-serif;
        }
        .counter-label {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 5px;
            display: block;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 38px; margin: 0; color: white; }
        .sub { font-size: 13px; color: #adb5bd; margin-bottom: 30px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button.action-btn {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--border);
            padding: 18px 10px;
            border-radius: 22px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }
        button.action-btn:hover { background: var(--accent); transform: translateY(-3px); }

        #sonuc { margin-top: 30px; background: rgba(0, 0, 0, 0.2); padding: 20px; border-radius: 25px; min-height: 260px; }
        img { width: 100%; border-radius: 20px; display: none; margin-bottom: 20px; }
        #mesaj { font-size: 15px; color: #e9ecef; }

        .ask-section { margin-top: 40px; padding-top: 25px; border-top: 1px solid var(--border); position: relative; min-height: 160px; }
        .evet-btn { background: #27ae60; color: white; border: none; padding: 12px 30px; border-radius: 15px; font-weight: 600; position: absolute; left: 15%; cursor: pointer; z-index: 10; }
        #noBtn { background: rgba(255, 255, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 12px 30px; border-radius: 15px; font-weight: 600; position: absolute; left: 55%; transition: 0.15s; cursor: pointer; z-index: 10; }

        .heart { position: fixed; font-size: 25px; animation: floatUp 2s ease-out forwards; pointer-events: none; z-index: 999; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes floatUp { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body onclick="createHeart(event)">

<div id="waiting-screen" onclick="startRecognition()">
    <span class="mic-icon">🎙️</span>
    <h2 style="font-family: 'Playfair Display', serif; font-size: 28px;">Zeynep, Hazır mısın?</h2>
    <p style="font-weight: 300; opacity: 0.7;">Tıkla ve "Seviyorum seni" de...</p>
    <p style="font-size: 10px; opacity: 0.4; margin-top: 20px;">(Sesli söyleyemezsen ekrana çift tıkla)</p>
</div>

<div id="main-content">
    <div class="live-counter">
        <span class="counter-numbers" id="clock">YÜKLENİYOR...</span>
        <span class="counter-label">Seni sevdiğim her an bir ömre bedel...</span>
    </div>

    <h1>Zeynep</h1>
    <p class="sub">Senin için buradayım...</p>
    
    <div class="grid">
        <button class="action-btn" onclick="karistir('hormon')">Nazlıyım 😤</button>
        <button class="action-btn" onclick="karistir('agri')">Sancım Var 🤕</button>
        <button class="action-btn" onclick="karistir('sov')">Sövecek Yer 🌋</button>
        <button class="action-btn" onclick="karistir('moral')">İlgi Ver 🥰</button>
        <button class="action-btn" onclick="falBak()" style="grid-column: span 2; background: rgba(255,77,109,0.1);">Günün Falı 🔮</button>
    </div>

    <div id="sonuc">
        <img id="resim" src="" alt="Zeynep ✨">
        <p id="mesaj">Zeynep, senin mutluluğun benim huzurum...</p>
    </div>

    <div class="ask-section" id="askSection">
        <p style="font-weight: 600;">Beni hiç bırakmayacaksın değil mi? 🥺</p>
        <div style="position: relative; height: 80px; margin-top: 15px;">
            <button class="evet-btn" onclick="tebrikler()">EVET</button>
            <button id="noBtn" onmouseover="kac()" ontouchstart="kac()">HAYIR</button>
        </div>
    </div>
</div>

<script>
    // --- ÖZEL BAŞLANGIÇ TARİHİ: 4 OCAK 2026 ---
    const startDate = new Date('2026-01-04T00:00:00');

    function updateClock() {
        const now = new Date();
        const diff = now - startDate;
        
        if (diff < 0) {
            document.getElementById('clock').innerText = "BAŞLAMASINA AZ KALDI";
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / (1000 * 60)) % 60);
        const secs = Math.floor((diff / 1000) % 60);
        
        const h = hours < 10 ? "0" + hours : hours;
        const m = mins < 10 ? "0" + mins : mins;
        const s = secs < 10 ? "0" + secs : secs;
        
        document.getElementById('clock').innerText = `${days} GÜN ${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Ses Tanıma
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'tr-TR';

    function startRecognition() {
        try { recognition.start(); } catch(e){
            // Tarayıcı desteklemiyorsa veya hata verirse direkt aç
            showMain();
        }
    }

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        if (text.includes("seviyorum") || text.includes("zeynep")) {
            showMain();
        }
    };

    // Yedek giriş metodu (Çift tıklama)
    window.addEventListener('dblclick', () => {
        if(document.getElementById('main-content').style.display !== 'block') showMain();
    });

    function showMain() {
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        document.getElementById('waiting-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
    }

    const icerikler = {
        hormon: { gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZ5NXF6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/OPU6wUKARA8AU/giphy.gif", mesajlar: ["Zeynep, o sinirli halini bile çok seviyorum... Her halinle benimsin."] },
        agri: { gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZ5NXF6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/3M4NpbLCTxBqU/giphy.gif", mesajlar: ["Kıyamam sana, keşke ağrını alabilsem... Uzan ve dinlen bebeğim."] },
        sov: { gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZ5NXF6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/11tVV6KzAl_Y0E/giphy.gif", mesajlar: ["Söv bebeğim, beraber rahatlayalım! İçinde ne varsa dök! 🔥"] },
        moral: { gif: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJtZzZ5NXF6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6ZzV6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/k9Jw0MW9TV6DbewYXW/giphy.gif", mesajlar: ["Sen gülünce dünya güzelleşiyor Zeynep. Sen benim her şeyimsin. ❤️"] }
    };

    function karistir(mod) {
        const alan = icerikler[mod];
        const img = document.getElementById('resim');
        img.style.display = 'block'; 
        img.src = alan.gif;
        document.getElementById('mesaj').innerText = alan.mesajlar[Math.floor(Math.random() * alan.mesajlar.length)];
    }

    function falBak() {
        const fallar = ["Gülüşün birinin ömrünü uzatıyor!", "Bugün şansın Zeynep kadar açık!", "Seni çok seven biri şu an sadece seni düşünüyor... ✨"];
        alert("🔮 Falın:\n\n" + fallar[Math.floor(Math.random()*fallar.length)]);
    }

    function kac() {
        const btn = document.getElementById('noBtn');
        const container = document.getElementById('askSection');
        
        const maxX = container.clientWidth - btn.offsetWidth;
        const maxY = container.clientHeight - btn.offsetHeight;
        
        const randomX = Math.max(0, Math.floor(Math.random() * maxX));
        const randomY = Math.max(0, Math.floor(Math.random() * maxY));
        
        btn.style.left = randomX + 'px';
        btn.style.top = randomY + 'px';
    }

    function createHeart(e) {
        const symbols = ['❤️', '✨', '🌸', '🧸', '☁️'];
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 2000);
    }

    function tebrikler() {
        confetti({ particleCount: 200, spread: 100 });
        alert("Zeynep... Biliyordum! Her saniye seni daha çok seveceğim! ❤️");
    }
</script>
</body>
</html>
